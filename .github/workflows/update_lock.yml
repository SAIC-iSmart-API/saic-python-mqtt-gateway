name: Update lock file

on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  update-lock:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: develop

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1

      - name: Update lock file
        run: poetry update --lock --no-interaction

      # Quick check on one Python version before opening a PR. The full matrix
      # runs on the PR branch via the dispatch step below.
      - name: Install dependencies
        run: poetry install --no-root --no-interaction

      - name: Lint
        run: poetry run ruff check .

      - name: Type check
        run: poetry run mypy

      - name: Run tests
        run: poetry run pytest tests

      - name: Open pull request
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          base: develop
          branch: chore/update-lock
          commit-message: "chore: update lock file"
          title: "chore: update lock file"
          body: "Monthly `poetry update`. Review the lock file diff and wait for CI."
          add-paths: poetry.lock
          delete-branch: true

      # Pushes made with GITHUB_TOKEN don't trigger CI, so start it by hand.
      # Its checks are reported on the PR's head commit.
      - name: Run CI on the pull request
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build_and_test_python.yml --ref chore/update-lock
